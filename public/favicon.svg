<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --badge-bg: #fff0f5;
      --badge-border: #fbcfe8;
      --bunny-white: #ffffff;
      --bunny-stroke: #f43f5e;
      --bunny-inner: #f9a8d4;
      --bunny-cheek: #fb7185;
      --bunny-nose: #e11d48;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --badge-bg: #1c0d18;
        --badge-border: #831843;
        --bunny-white: #ffffff;
        --bunny-stroke: #fb7185;
        --bunny-inner: #f472b6;
        --bunny-cheek: #fda4af;
        --bunny-nose: #f43f5e;
      }
    }
    .badge {
      fill: var(--badge-bg);
      stroke: var(--badge-border);
      stroke-width: 1.2;
    }
    .bunny-body {
      fill: var(--bunny-white);
      stroke: var(--bunny-stroke);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .bunny-inner-ear {
      fill: var(--bunny-inner);
    }
    .bunny-cheek {
      fill: var(--bunny-cheek);
      opacity: 0.85;
    }
    .bunny-nose {
      fill: var(--bunny-nose);
    }
  </style>

  <!-- App Icon Badge container (matching header brand logo) -->
  <rect class="badge" x="1" y="1" width="30" height="30" rx="8.5" />

  <!-- Left Ear -->
  <path class="bunny-body" d="M10 21C7.8 15.5 8.2 4.8 11.2 4C13.8 3.2 13.8 13 13.4 21Z" />
  <path class="bunny-inner-ear" d="M10.6 17.5C9.2 13.5 9.7 7.2 11.2 6.7C12.7 6.2 12.7 11.5 12.4 17.5Z" />

  <!-- Right Ear -->
  <path class="bunny-body" d="M22 21C24.2 15.5 23.8 4.8 20.8 4C18.2 3.2 18.2 13 18.6 21Z" />
  <path class="bunny-inner-ear" d="M21.4 17.5C22.8 13.5 22.3 7.2 20.8 6.7C19.3 6.2 19.3 11.5 19.6 17.5Z" />

  <!-- Head / Face -->
  <path class="bunny-body" d="M9 22.5C9 26.5 12 28.5 16 28.5C20 28.5 23 26.5 23 22.5C23 19.8 20.5 19.8 16 19.8C11.5 19.8 9 19.8 9 22.5Z" />

  <!-- Cheeks -->
  <ellipse class="bunny-cheek" cx="12" cy="23.5" rx="1.5" ry="0.9" />
  <ellipse class="bunny-cheek" cx="20" cy="23.5" rx="1.5" ry="0.9" />

  <!-- Cute Nose -->
  <polygon class="bunny-nose" points="15.3,22.2 16.7,22.2 16,23.2" />
</svg>
